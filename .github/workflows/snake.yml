name: Generate Snake

on:
  # Keep the grid current without needing a manual run.
  schedule:
    - cron: "0 */12 * * *"
  # Lets you re-run it by hand from the Actions tab.
  workflow_dispatch:
  # Runs once on push so the `output` branch exists immediately, rather than
  # waiting up to 12h for the first scheduled run.
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The default GITHUB_TOKEN is read-only in many repos; the publish step
    # below force-pushes to the `output` branch and needs write access.
    permissions:
      contents: write

    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # Colours match the README palette: mint contribution ramp on the
          # near-black field, purple snake. '#' must be encoded as %23 here
          # because these are query strings, not plain values.
          outputs: |
            dist/github-snake.svg?color_snake=%23A855F7&color_dots=%23EBEDF0,%23C6F5EC,%237FE3D2,%233ECFBA,%2322E5C8
            dist/github-snake-dark.svg?color_snake=%23A855F7&color_dots=%230D1117,%23173F3A,%231A7A6E,%231BC0AC,%2322E5C8

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
