<svg xmlns="http://www.w3.org/2000/svg" width="124" height="38" viewBox="0 0 124 38" role="img" aria-label="CONNECT">
  <defs>
    <clipPath id="pill">
      <rect x="1" y="1" width="122" height="36" rx="18"/>
    </clipPath>
    <radialGradient id="liq1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#22E5C8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#3D8BFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="liq2" cx="70%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#EC4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22E5C8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="topHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="122" height="36" rx="18" fill="#090d14"/>

  <g clip-path="url(#pill)">
    <ellipse cx="36" cy="19" rx="48" ry="38" fill="url(#liq1)">
      <animate attributeName="cx" values="20;104;20" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="10;28;10" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="88" cy="19" rx="48" ry="38" fill="url(#liq2)">
      <animate attributeName="cx" values="104;20;104" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="28;10;28" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    
    <rect width="124" height="38" fill="url(#glassFill)"/>

    <path d="M 12 3 H 112 C 117 3 120 6 120 10 C 90 13 30 13 4 10 C 4 6 7 3 12 3 Z" fill="url(#topHighlight)" opacity="0.4"/>

    <rect x="-60" y="0" width="50" height="38" fill="url(#topHighlight)" opacity="0.3" filter="url(#softBlur)">
      <animate attributeName="x" values="-60;130;-60" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="122" height="36" rx="18" fill="none" stroke="url(#glassRim)" stroke-width="1.2"/>
  <path d="M 18 1.5 L 106 1.5" stroke="#ffffff" stroke-opacity="0.9" stroke-linecap="round" stroke-width="1"/>
  <text x="62" y="23.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#ffffff" filter="url(#glow)">CONNECT</text>
</svg>